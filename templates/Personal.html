<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Banking | Cyber Shield Bank</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body { background: #050a14; color: #00d4ff; font-family: 'Segoe UI', sans-serif; }
        .cyber-container { padding: 50px 10%; text-align: center; }
        .cyber-card { 
            background: rgba(0, 212, 255, 0.05); 
            border: 1px solid #00d4ff; 
            padding: 40px; 
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            margin-top: 30px;
        }
        h1 { font-size: 3rem; text-shadow: 0 0 10px #00d4ff; }
        .status-tag { color: #39ff14; font-weight: bold; letter-spacing: 2px; }
        .back-btn { 
            display: inline-block; margin-top: 30px; padding: 12px 30px; 
            border: 1px solid #00d4ff; color: #00d4ff; text-decoration: none;
            transition: 0.3s;
        }
        .back-btn:hover { background: #00d4ff; color: #050a14; }

        body { 
            margin: 0;
            padding: 0;
            /* Background image with a dark purple overlay */
            background: linear-gradient(rgba(18, 13, 33, 0.85), rgba(44, 19, 78, 0.9)), 
                        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #e0aaff;
        }

        .glass-template {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(111, 0, 255, 0.4);
            max-width: 500px;
            width: 90%;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 0 15px #9d4edd; }
        p { font-size: 1rem; line-height: 1.6; opacity: 0.8; }

        .back-home-btn {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 30px;
            background: #7b2cbf;
            color: white;
            text-decoration: none;
            border: 1px solid #7b2cbf;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.4s;
            box-shadow: 0 0 15px rgba(123, 44, 191, 0.5);
        }

        .back-home-btn:hover {
            background: #9d4edd;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.8);
        }
        #view-btn{
            background-color: #9d4edd;
            border: none;
            padding: 12px 25px;
            color: white;
            border-radius:8px ;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #view-btn:hover{
             background:#7b2cbf ;
             transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="glass-template">
        <h1>Personal Banking Services</h1>
        <p>Manage your savings, cards, and investments in one secure place.</p>
        <div class="glass-template">
        <h1>Personal Banking</h1>
        <p>Manage your savings and investments securely.</p>

        <!-- Interactive Balance Section -->
        <div id="balance-card" style="background: rgba(0,0,0,0.4); padding: 30px; border-radius: 20px; border: 1px dashed #7b2cbf; margin: 30px 0;">
            <h3 id="acc-status" style="margin-top:0;">Account: XXXX 8829</h3>
            <h2 id="balance-text" style="color: #39ff14; display: none; font-size: 2rem; margin: 10px 0;">$ 45,230.15</h2>
            <button onclick="revealBalance()" id="view-btn">View Balance</button>
        </div>

    <script>
        function revealBalance() {
            // Balance-ah kaata
            document.getElementById('balance-text').style.display = 'block';
            // Button-ah maraikka
            document.getElementById('view-btn').style.display = 'none';
            // Text-ah maatha
            document.getElementById('acc-status').innerText = "Verified Balance:";
            document.getElementById('acc-status').style.color = "#39ff14";
        }
    </script>
        <br><a href="Homepage.html" class="login-btn">Back to Home</a>
    </div>
</body>
</html>
