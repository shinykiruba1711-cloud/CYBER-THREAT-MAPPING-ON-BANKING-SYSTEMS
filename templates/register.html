<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Account | CyberShield Bank</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(5,10,20,0.75),rgba(5,10,20,0.85)),
    url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1400&q=80');
    background-size:cover;
    background-position:center;
}

.form-box{
    width:420px;
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 25px rgba(0,212,255,0.15);
}

.logo{
    text-align:center;
    color:#00d4ff;
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.logo span{
    color:white;
}

.sub{
    text-align:center;
    color:#ccc;
    font-size:14px;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(0,0,0,0.45);
    color:white;
    font-size:15px;
}

input::placeholder{
    color:#aaa;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00d4ff,#005eff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 18px #00d4ff;
}

.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#00d4ff;
    text-decoration:none;
    font-size:14px;
}

.back a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="form-box">

<div class="logo">CYBERSHIELD <span>BANK</span></div>
<div class="sub">Create Secure New Account</div>

<form action="/send_otp" method="POST">

<input type="text" name="username" placeholder="Create Username" required>

<input type="password" name="password" placeholder="Create Password" required>

<input type="email" name="email" placeholder="Enter Email Address" required>

<button type="submit">SEND OTP</button>

</form>

<div class="back">
<a href="/">← Back to Home</a>
</div>

</div>

</body>
</html>
