<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Verification</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.box{
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:20px;
    width:350px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,255,255,0.2);
}
h2{
    color:#00eaff;
    margin-bottom:10px;
}
p{
    color:white;
    font-size:14px;
}
input{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
}
button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#00eaff;
    color:black;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#00bcd4;
}
</style>
</head>

<body>

<div class="box">
    <h2>OTP Verification</h2>
    <p>Check your Email and Enter OTP</p>

    <form method="POST">
        <input type="text" name="otp" placeholder="Enter OTP" required>
        <button type="submit">Verify OTP</button>
    </form>
</div>

</body>
</html>
