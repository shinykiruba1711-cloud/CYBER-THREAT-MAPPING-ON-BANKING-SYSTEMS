<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Command Center | Admin Access</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body class="admin-war-room">

    <div class="cyber-overlay">
        <div class="login-frame">

            <div class="scanner-line"></div>

            <h2>COMMANDER LOGIN</h2>
            <p class="access-level">LEVEL 4 CLEARANCE REQUIRED</p>

            <form action="admin dashboard.html" method="get">

                <div class="field">
                    <label>OPERATOR ID</label>
                    <input type="text" placeholder="Enter ID" required>
                </div>

                <div class="field">
                    <label>ENCRYPTION KEY</label>
                    <input type="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="cyber-btn">
                    INITIALIZE SYSTEM
                </button>

            </form>

            <div class="footer-stats">
                <span>ENCRYPTION: AES-256</span>
                <span>STATUS: SECURE</span>
            </div>

        </div>
    </div>

</body>
</html>
